# Copy the connection settings from hcs.example.properties into a private local file.
# Run this only in a disposable HCS 507 transparent multi-primary PDB.
# The probe creates a uniquely named test table and creates/drops probe.slot-name.
# probe.slot-name MUST be a new name and MUST differ from slot.name.
hcs.cms-endpoints=cms.example.com:13003
database=your_pdb
username=your_replication_user
password=replace_locally
hcs.tenant-name=your_tenant
hcs.tenant-password=replace_locally
slot.name=existing_business_slot_not_used_by_probe
schema-name=public
table-name=unused_for_probe
sslmode=require
scan.startup.mode=incremental

probe.schema=public
probe.slot-name=handoff_probe_slot
probe.allow-mutations=true
